databases:
  - name: tabbycat_database
    databaseName: tabbycat
    user: tabbycat
    plan: free  # Upgrade to 'starter' or higher for production

services:
  - type: web
    name: tabbycat_web
    env: python
    plan: free  # Upgrade to 'starter' for production
    region: oregon
    buildCommand: "./bin/render-compile.sh"
    startCommand: "cd tabbycat && python run-asgi.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tabbycat_database
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tabbycat_redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Python version — must match Pipfile [requires]
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Gunicorn workers
      - key: WEB_CONCURRENCY
        value: 4

      # Render flags
      - key: ON_RENDER
        value: true
      - key: USING_NGINX
        value: 0  # Not 'false'; is cast to int

      # Multi-tenancy
      - key: MULTI_TENANT_MODE
        value: true
      - key: TABBYCAT_BASE_DOMAIN
        value: shebafi.xyz
      - key: TENANT_BASE_DOMAIN
        value: shebafi.xyz

      # Sentry (set your own DSN or leave DISABLE_SENTRY=true)
      - key: DISABLE_SENTRY
        value: true
      - key: SENTRY_DSN
        sync: false  # Optional: set your own Sentry DSN in the dashboard

      # Email (optional — for notifications)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

      # Optional tab-director email for error reporting
      - key: TAB_DIRECTOR_EMAIL
        sync: false
      - key: TIME_ZONE
        sync: false  # e.g. Asia/Dhaka

  - type: worker
    name: tabbycat_worker
    env: python
    plan: free  # Upgrade to 'starter' for production
    region: oregon
    buildCommand: "./bin/render-compile.sh"
    startCommand: "cd tabbycat && python manage.py runworker notifications adjallocation venues"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tabbycat_database
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tabbycat_redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: tabbycat_web
          envVarKey: DJANGO_SECRET_KEY
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ON_RENDER
        value: true
      - key: IS_WORKER
        value: 1
      - key: MULTI_TENANT_MODE
        value: true
      - key: TABBYCAT_BASE_DOMAIN
        value: shebafi.xyz
      - key: TENANT_BASE_DOMAIN
        value: shebafi.xyz
      - key: DISABLE_SENTRY
        value: true
      - key: TIME_ZONE
        sync: false
      # Email settings for sending notifications from worker
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  - type: redis
    name: tabbycat_redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    plan: free  # Upgrade to 'starter' for persistent Redis in production
    maxmemoryPolicy: allkeys-lru

  # Daily cron: auto-deactivate tournaments that have passed their 6-month expiry
  - type: cron
    name: tabbycat_expire_tournaments
    env: python
    region: oregon
    schedule: "0 1 * * *"  # Every day at 01:00 UTC
    buildCommand: "./bin/render-compile.sh"
    startCommand: "cd tabbycat && python manage.py deactivate_expired_tournaments"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tabbycat_database
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: tabbycat_web
          envVarKey: DJANGO_SECRET_KEY
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ON_RENDER
        value: true
      - key: MULTI_TENANT_MODE
        value: true
      - key: TABBYCAT_BASE_DOMAIN
        value: shebafi.xyz
      - key: DISABLE_SENTRY
        value: true
